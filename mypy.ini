[mypy]
ignore_missing_imports = True

# Organizer-owned benchmark files are contractually immutable: they are
# verified by hash against the starter kit and must never be edited to
# satisfy a type checker.
[mypy-submit]
follow_imports = skip

[mypy-evaluate]
follow_imports = skip

[mypy-baseline]
follow_imports = skip

[mypy-data]
follow_imports = skip
